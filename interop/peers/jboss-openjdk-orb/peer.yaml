candidateOrigin:
  kind: maven
  coordinate: "org.jboss.openjdk-orb:openjdk-orb:10.1.1.Final"
  version: "10.1.1.Final"
  repository: Maven Central
  project: JBoss OpenJDK ORB
  sourceUrl: "https://repo.maven.apache.org/maven2/org/jboss/openjdk-orb/openjdk-orb/"
license:
  observed: GPL-2.0-with-Classpath-exception
