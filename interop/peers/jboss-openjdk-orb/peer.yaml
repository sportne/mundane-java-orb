  namingCommand: g4-script-required
  readinessCheck: g4-script-required
reports:
  logs: "build/interop/jboss-openjdk-orb/logs"
  iors: "build/interop/jboss-openjdk-orb/iors"
  structuredReports: "build/interop/jboss-openjdk-orb/reports"
g4FollowUp:
