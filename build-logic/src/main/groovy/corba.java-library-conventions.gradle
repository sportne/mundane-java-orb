import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask
import org.gradle.api.tasks.testing.logging.TestExceptionFormat

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
    id 'net.ltgt.errorprone'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}


dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    errorprone 'com.google.errorprone:error_prone_core:2.49.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = TestExceptionFormat.FULL
    }
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'interop', 'native-image', 'slow', 'fuzz'
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            enabled = true
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.00 // Raised after real implementation begins; see docs/verification/coverage-policy.md.
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

checkstyle {
    toolVersion = '13.4.2'
    configDirectory = rootProject.file('config/checkstyle')
}

spotbugs {
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '**/*.md', '**/*.yaml', '**/*.yml', '**/*.toml', '**/*.xml'
        targetExclude(
            '**/build/**',
            '**/.gradle/**',
            '**/.git/**',
            '**/out/**'
        )
        trimTrailingWhitespace()
        endWithNewline()
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = project.description ?: project.name
                url = 'https://example.invalid/corba-ecosystem'
            }
        }
    }
    repositories {
        maven {
            name = 'localStaging'
            url = rootProject.layout.buildDirectory.dir('staging-repository')
        }
    }
}
