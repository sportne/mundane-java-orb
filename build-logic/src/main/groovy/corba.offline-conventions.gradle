// This task gives humans a quick reminder of how to run the build without internet access.
tasks.register('printOfflineBuildInstructions') {
    group = 'build setup'
    description = 'Prints offline build instructions.'
    doLast {
        println 'Offline build:'
        println '  1. Prepare a local Maven repository with tools/prepare-offline-repository.sh.'
        println '  2. Ensure gradle/wrapper/gradle-wrapper.jar and the Gradle distribution are provisioned.'
        println '  3. Run: ./gradlew --offline -Pcorba.offlineRepo=/path/to/local-maven-repo clean qualityGate'
    }
}
