# Default JVM options for Gradle itself. UTF-8 keeps text handling the same on every machine.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Let independent projects build at the same time.
org.gradle.parallel=true
# Reuse task outputs when Gradle can prove the inputs did not change.
org.gradle.caching=true
# Reuse the configured task graph between matching runs so local checks start faster.
org.gradle.configuration-cache=true
# Show Gradle deprecation and warning messages during the migration to this scaffold.
org.gradle.warning.mode=all
# Require checked dependency metadata so unexpected dependency changes fail the build.
org.gradle.dependency.verification=strict

# Build policy
# Project version used in published Maven coordinates.
corba.version=1.0.0
# Java language/API level used by compile tasks.
corba.javaRelease=21
# Default CORBA compatibility profile used by future implementation tasks.
corba.primaryProfile=CORBA_3_4_FULL

# Transitional aliases. Prefer corba.javaRelease, corba.primaryProfile, and corba.offlineRepo.
# Old spelling kept temporarily so older scripts do not break during the scaffold transition.
corbaJavaRelease=21
# Old spelling kept temporarily so older scripts do not break during the scaffold transition.
corbaPrimaryCorbaProfile=CORBA_3_4_FULL
# Old spelling kept temporarily so older scripts do not break during the scaffold transition.
corbaOfflineRepo=

# Offline build support. Set with -Pcorba.offlineRepo=/path/to/maven-repo.
# Empty means normal online dependency resolution. A path here must contain all required dependencies.
corba.offlineRepo=
