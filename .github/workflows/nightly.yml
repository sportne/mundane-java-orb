name: nightly

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  nightly-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Bootstrap wrapper if needed
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version=9.5.1 --distribution-type=bin
          fi
      - name: Nightly scaffold verification
        run: ./gradlew clean qualityGate
