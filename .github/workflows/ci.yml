name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.distribution }} ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: temurin
            java: '21'
          - distribution: temurin
            java: '25'
          - distribution: graalvm
            java: '21'
          - distribution: graalvm
            java: '25'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5.0.1
      - name: Quality gate
        run: ./gradlew qualityGate
