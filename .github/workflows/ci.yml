name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  jvm:
    name: JVM ${{ matrix.distribution }} ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: temurin
            java: '21'
          - distribution: temurin
            java: '25'
          - distribution: graalvm
            java: '21'
          - distribution: graalvm
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Bootstrap wrapper if needed
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version=9.5.1 --distribution-type=bin
          fi
      - name: Verify
        run: ./gradlew clean qualityGate

  native-smoke:
    name: Native Image smoke ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: graalvm
          native-image-job-reports: true
          cache: gradle
      - name: Bootstrap wrapper if needed
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version=9.5.1 --distribution-type=bin
          fi
      - name: Native smoke placeholder
        run: ./gradlew clean test
