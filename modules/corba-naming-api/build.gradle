// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'CosNaming API/generated-compatible support.'

dependencies {
    // Naming diagnostics use the shared stable DiagnosticCode value type.
    api project(':modules:corba-common')

    // Local object bindings expose in-process ORB object references in this G6 slice.
    api project(':modules:corba-orb-core')
}
