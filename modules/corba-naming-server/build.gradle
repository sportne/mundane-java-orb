// This application module builds a future service app, runs quality/coverage checks, publishes it, and checks native-image compatibility.
plugins {
    id 'corba.application-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
    id 'corba.native-image-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Standalone Naming Service implementation and distribution.'

dependencies {
    // The server implements the public local Naming Service API.
    api project(':modules:corba-naming-api')

    // corbaname integration reuses the existing bounded object URL parser.
    api project(':modules:corba-ior')

    // Local initial references are registered with the in-process ORB.
    api project(':modules:corba-orb-core')

    // Tests use shared fixture and architecture helper conventions.
    testImplementation project(':modules:corba-testkit')
}
