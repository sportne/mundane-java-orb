// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Event Service implementation module.'

dependencies {
    // Event Service diagnostics reuse the repository-wide stable diagnostic-code value.
    api project(':modules:corba-common')

    // Local Event Service push and pull surfaces carry project Any values.
    api project(':modules:corba-any')

    // G8-240 exposes the supported Event Service subset through the static ORB/IIOP bridge.
    api project(':modules:corba-iiop')

    // Network Event Service startup owns local ORB references for channel/admin/proxy dispatch.
    api project(':modules:corba-orb-core')

    // Optional Naming registration binds the EventChannel IOR into the network Naming server.
    api project(':modules:corba-naming-server')

    // Event Service descriptors use the shared static generated-type metadata model.
    api project(':modules:corba-typecode')

    // Event payloads and object-reference results are encoded with bounded CDR primitives.
    implementation project(':modules:corba-cdr')

    // Repository IDs identify the supported CosEventChannelAdmin/CosEventComm interfaces.
    implementation project(':modules:corba-repository-id')
}
