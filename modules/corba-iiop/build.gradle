// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'IIOP TCP/TLS transport, connection management, request correlation, and timeouts.'

dependencies {
    // IIOP TCP transports complete GIOP messages over sockets.
    api project(':modules:corba-giop')

    // G10 network dispatch bridges IIOP requests into existing local ORB references.
    api project(':modules:corba-orb-core')

    // Network object references are represented as standard IOR/IIOP profile values.
    api project(':modules:corba-ior')

    // G10 Portable Interceptors provide optional request-flow hooks and service contexts.
    api project(':modules:corba-interceptors')

    // IIOP diagnostics reuse the shared diagnostic code value type.
    api project(':modules:corba-common')

    // Network dispatch tests activate servants through the local POA.
    testImplementation project(':modules:corba-poa')

    // Restart-oriented IIOP tests reuse bounded retry helpers from the shared testkit.
    testImplementation project(':modules:corba-testkit')
}
