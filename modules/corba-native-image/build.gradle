// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'Native Image metadata, features, tests, and diagnostics.'

sourceSets {
    nativeSmoke {
        java.srcDir 'src/nativeSmoke/java'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.output + configurations.runtimeClasspath
    }
    test {
        runtimeClasspath += sourceSets.nativeSmoke.runtimeClasspath
    }
}

dependencies {
    // Native smoke entry points validate representative G6 runtime surfaces.
    nativeSmokeImplementation project(':modules:corba-idlj-cli')
    nativeSmokeImplementation project(':modules:corba-ior')
    nativeSmokeImplementation project(':modules:corba-naming-server')
    nativeSmokeImplementation project(':modules:corba-orb-core')
    nativeSmokeImplementation project(':modules:corba-interop-testkit')
    // Native smoke restart checks share bounded retry helpers with JVM tests.
    nativeSmokeImplementation project(':modules:corba-testkit')
    // G7-100 adds a smoke entry point for the approved RMI-IIOP local wire slice.
    nativeSmokeImplementation project(':modules:corba-rmi-iiop')
    // G8-100 adds the local Time Service value and clock query smoke surface.
    nativeSmokeImplementation project(':modules:corba-time-service')
    // G8-250 adds the local and loopback Event Service smoke surface.
    nativeSmokeImplementation project(':modules:corba-event-service')
    // G8-370 adds the local and loopback Notification Service smoke surface.
    nativeSmokeImplementation project(':modules:corba-notification-service')
    // G8-470 adds the local and loopback Trading Service smoke surface.
    nativeSmokeImplementation project(':modules:corba-trading-service')
    // G8-570 adds the local Transaction Service / OTS smoke surface.
    nativeSmokeImplementation project(':modules:corba-transaction-service')
    nativeSmokeImplementation project(':modules:corba-typecode')

    // Unit tests execute the smoke entry points on the JVM before native compilation.
    testImplementation sourceSets.nativeSmoke.output
}

def javaHomeNativeImage = providers.provider {
    def javaHome = System.getenv('JAVA_HOME')
    if (!javaHome) {
        return null
    }
    def candidate = new File(javaHome, 'bin/native-image')
    candidate.isFile() ? candidate.absolutePath : null
}
def sdkmanNativeImage = providers.provider {
    def candidatesRoot = System.getenv('SDKMAN_CANDIDATES_DIR')
    if (!candidatesRoot) {
        def home = System.getenv('HOME')
        if (!home) {
            return null
        }
        candidatesRoot = new File(home, '.sdkman/candidates').absolutePath
    }
    def javaCandidates = new File(candidatesRoot, 'java')
    def current = new File(javaCandidates, 'current/bin/native-image')
    if (current.isFile()) {
        return current.absolutePath
    }
    def candidates = javaCandidates.listFiles()
            ?.collect { candidate -> new File(candidate, 'bin/native-image') }
            ?.findAll { nativeImage -> nativeImage.isFile() }
            ?.sort { left, right -> left.absolutePath <=> right.absolutePath }
    candidates ? candidates.last().absolutePath : null
}
def nativeImageExecutable = providers.environmentVariable('NATIVE_IMAGE')
        .orElse(javaHomeNativeImage)
        .orElse(sdkmanNativeImage)
        .orElse('native-image')

