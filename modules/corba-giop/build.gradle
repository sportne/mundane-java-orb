// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'GIOP message model, parser, writer, service contexts, and fragmentation.'

dependencies {
    // GIOP message bodies are encoded as bounded CDR streams.
    api project(':modules:corba-cdr')

    // G10 target-address values reuse the IOR profile/reference model.
    api project(':modules:corba-ior')

    // GIOP limits use the shared bounded-limit value type.
    api project(':modules:corba-common')

    // GIOP tests compare deterministic wire bytes with the repository golden-fixture helpers.
    testImplementation project(':modules:corba-testkit')
}
