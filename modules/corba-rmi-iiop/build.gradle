// This module uses the standard library bundle: Java 21 defaults, quality checks, coverage, and publishing.
plugins {
    id 'corba.java-library-conventions'
    id 'corba.quality-conventions'
    id 'corba.coverage-conventions'
    id 'corba.publishing-conventions'
}

// Human-readable module purpose shown in Gradle reports and generated Maven metadata.
description = 'RMI-IIOP and Java-to-IDL support, staged behind dedicated ADR.'

dependencies {
    // Eligibility diagnostics reuse the shared stable diagnostic contract.
    api project(':modules:corba-common')

    // G7-060 owns bounded local RMI-IIOP payload encoding through CDR readers/writers.
    api project(':modules:corba-cdr')

    // G7-070 generated adapters expose local ORB and POA invocation surfaces.
    api project(':modules:corba-orb-core')
    api project(':modules:corba-poa')

    // G7-080 bridges approved RMI-IIOP payloads over bounded GIOP/IIOP loopback paths.
    api project(':modules:corba-giop')
    api project(':modules:corba-iiop')
}
